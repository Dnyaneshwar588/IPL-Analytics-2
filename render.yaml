services:
  # 1. FastAPI Machine Learning Service
  - type: web
    name: ipl-analytics-ml
    env: python
    region: singapore
    plan: free
    rootDir: ml_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false

  # 2. Express Backend API
  - type: web
    name: ipl-analytics-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: ipl-analytics-ml
          property: host

  # 3. React Static Frontend
  - type: web
    name: ipl-analytics-frontend
    env: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://ipl-analytics-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
